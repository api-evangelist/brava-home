aid: brava-home
name: Brava Home
description: >-
  Brava Home, Inc. is a Redwood City, California consumer-hardware company that
  makes the Brava smart countertop oven — a connected cooking appliance that uses
  its patented Pure Light infrared-lamp technology to sear, bake, air-fry,
  dehydrate, toast, reheat, and slow-cook, controlled through the Brava Home
  mobile app and a guided recipe platform. Brava sells direct-to-consumer through
  a Shopify storefront at shop.brava.com. Brava does not publish a public
  developer/device API; its machine-facing surface is agentic commerce — the
  storefront exposes a Shopify-native Universal Commerce Protocol (UCP) profile
  at /.well-known/ucp and a Model Context Protocol (MCP) endpoint so shopping
  agents can search the catalog, build carts, and drive buyer-approved checkout.
  Originally added to the API Evangelist network as a cowboy-ventures portfolio
  lead, this profile has been enriched from Brava's real public surface.
