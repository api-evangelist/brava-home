apis:
- name: Brava Storefront Commerce (UCP / MCP)
  description: >-
    Agentic-commerce surface for Brava's Shopify storefront. The store publishes a
    Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp and a
    native Model Context Protocol (MCP) endpoint that shopping agents call
    (tools/list) to discover catalog-search, cart, checkout, fulfillment,
    discount, and order tools. Shopify-provided; checkout requires contemporaneous
    human buyer approval and is rate-limited per IP. This is a commerce surface,
    not a Brava device/appliance API.
